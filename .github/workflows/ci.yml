name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: brew tap rogerchappel/tap "$GITHUB_WORKSPACE"
      - run: ./scripts/validate.sh

  formula-smoke:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        formula:
          - branchbrief
          - envprobe
          - proofdock
          - stackforge
          - taskbrief
          - worktreeguard
    steps:
      - uses: actions/checkout@v4
      - run: brew tap rogerchappel/tap "$GITHUB_WORKSPACE"
      - run: brew install --HEAD "rogerchappel/tap/${{ matrix.formula }}"
      - run: brew test "rogerchappel/tap/${{ matrix.formula }}"
